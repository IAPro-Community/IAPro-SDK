name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go vet ./...
      - run: go test ./... -count=1
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          printf "%s\n" "$unformatted"
          test -z "$unformatted"
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go vet ./...
      - run: go test ./... -count=1
  consumer-pin:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve immutable consumer dependency
        run: |
          cd "$(mktemp -d)"
          GOWORK=off go mod download -json github.com/IAPro-Community/IAPro-SDK@"$GITHUB_SHA"
