name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go vet ./...
      - run: go test ./... -count=1
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          printf "%s\n" "$unformatted"
          gofmt -d .
          test -z "$unformatted"
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go vet ./...
      - run: go test ./... -count=1
  consumer-pin:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve immutable consumer dependency
        env:
          SDK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "$(mktemp -d)"
          GOWORK=off go mod download -json github.com/IAPro-Community/IAPro-SDK@"$SDK_SHA"
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/react/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm pack --dry-run
